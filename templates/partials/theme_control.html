<details class="spi-theme-control">
  <summary class="tw:flex tw:items-center tw:gap-2" aria-label="Escolher tema"><span aria-hidden="true">◐</span> Tema <span data-theme-label>Luz</span></summary>
  <div class="spi-theme-options" role="group" aria-label="Temas disponíveis">
    <button type="button" data-set-theme="light" aria-pressed="false">☀ Solar</button>
    <button type="button" data-set-theme="dark" aria-pressed="false">☾ Lunar</button>
    <button type="button" data-set-theme="gourmet" aria-pressed="false">♨ Gourmet</button>
    <button type="button" data-set-theme="soft" aria-pressed="false">✧ Soft</button>
  </div>
</details>
