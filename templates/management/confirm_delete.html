{% extends 'base.html' %}

{% block page_title_text %}Confirmar exclusão{% endblock %}
{% block page_title %}Excluir {{ object_label }}{% endblock %}

{% block content %}
<div class="container-fluid management-shell">
    <section class="management-card delete-card">
        <span class="delete-icon"><i class="bi bi-exclamation-triangle"></i></span>
        <h2>Deseja excluir {{ object }}?</h2>
        <p>Esta ação não poderá ser desfeita.</p>
        <form method="post">{% csrf_token %}<a class="btn btn-light" href="{% url cancel_url_name %}">Cancelar</a><button class="btn btn-danger" type="submit"><i class="bi bi-trash"></i> Confirmar exclusão</button></form>
    </section>
</div>
{% endblock %}
