{% load static %}
<!doctype html><html lang="pt-br"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Erro {{ status_code }} | SPI</title>{% include 'adminlte/partials/_assets_prebuilt.html' %}<link rel="stylesheet" href="{% static 'css/app.css' %}"></head>
<body class="error-page-spi"><main class="error-card"><a class="error-brand" href="{% url 'dashboard' %}"><img src="{% static 'images/spi-mark.svg' %}" alt="SPI"></a><span class="error-code">{{ status_code }}</span><h1>{{ error_title }}</h1><p>{{ error_description }}</p><div class="d-flex flex-wrap justify-content-center gap-2"><a href="{% url 'dashboard' %}" class="btn btn-primary"><i class="bi bi-house-door me-2"></i>Ir para o início</a><button type="button" onclick="history.back()" class="btn btn-outline-secondary">Voltar</button></div></main>

<script src="{% static 'adminlte/js/adminlte.min.js' %}"></script>

<script src="{% static 'js/theme.js' %}"></script>

{% block page_js %}{% endblock %}


</body></html>
